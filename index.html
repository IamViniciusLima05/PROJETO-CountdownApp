<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CountdownApp | Contagem regressiva</title>
  <meta name="description" content="Contagem regressiva para seus eventos: dias, horas, minutos e segundos, com vários eventos ao mesmo tempo.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;700;900&family=Red+Hat+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="topo">
      <p class="marca">countdown<span>.</span></p>
      <button class="btn" id="novo">+ Novo evento</button>
    </header>

    <section class="destaque" id="destaque" aria-live="off"></section>

    <div class="barra">
      <h2>Seus eventos</h2>
      <div class="abas" role="group" aria-label="Filtro">
        <button data-filtro="proximos" aria-pressed="true">Próximos</button>
        <button data-filtro="passados" aria-pressed="false">Já aconteceram</button>
      </div>
    </div>
    <ul class="eventos" id="eventos"></ul>
  </main>

  <dialog id="dlg" aria-labelledby="dlg-titulo">
    <form method="dialog" id="form">
      <h2 id="dlg-titulo">Novo evento</h2>
      <label>Nome do evento<input id="f-nome" required maxlength="50" placeholder="Ex.: Viagem para a praia"></label>
      <div class="linha">
        <label>Data<input id="f-data" type="date" required></label>
        <label>Horário<input id="f-hora" type="time" value="00:00" required></label>
      </div>
      <label class="check"><input type="checkbox" id="f-anual"> Repetir todo ano (aniversários, datas comemorativas)</label>
      <fieldset><legend>Ícone</legend><div class="opcoes" id="f-emojis"></div></fieldset>
      <fieldset><legend>Cor</legend><div class="opcoes" id="f-cores"></div></fieldset>
      <div class="acoes">
        <button type="button" class="link perigo" id="f-excluir" hidden>Excluir</button>
        <button value="cancelar" formnovalidate class="btn sec">Cancelar</button>
        <button value="salvar" class="btn">Salvar</button>
      </div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <script src="js/script.js"></script>
</body>
</html>
